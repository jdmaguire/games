<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7035083353596708"
     crossorigin="anonymous"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Play chess against Stockfish 18 for free in your browser. Set the engine from beginner to superhuman and learn the game. No download or sign-up needed.">
<title>Chess — Free Browser Game</title>
<link rel="canonical" href="https://jdmaguire.github.io/games/chess.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Free Browser Games">
<meta property="og:title" content="Chess — Free Browser Game">
<meta property="og:description" content="Play chess against Stockfish 18 for free in your browser. Set the engine from beginner to superhuman.">
<meta property="og:url" content="https://jdmaguire.github.io/games/chess.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Chess — Free Browser Game">
<meta name="twitter:description" content="Play chess against Stockfish 18 for free in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoGame",
  "name": "Chess",
  "url": "https://jdmaguire.github.io/games/chess.html",
  "description": "Play chess against Stockfish 18 for free in your browser. Set the engine from beginner to superhuman.",
  "genre": "Strategy",
  "playMode": "SinglePlayer",
  "audience": { "@type": "PeopleAudience", "suitableForAge": "4+" },
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
}
</script>
<link rel="stylesheet" href="css/chess.css">
</head>
<body>
  <header>
    <a href="index.html">← Games</a>
    <div id="status"></div>
  </header>
  <div class="player" id="p-top">
    <div class="name" id="top-name"></div>
    <div class="material" id="top-mat"></div>
  </div>
  <div id="wrap">
    <div id="board"></div>
    <div id="promo"></div>
    <div id="overlay">
      <h1>♞ Chess</h1>
      <div id="ov-msg">Play against Stockfish 18, right in your browser.</div>
      <div class="row">
        <button id="side-w" class="on">Play White ♔</button>
        <button id="side-b">Play Black ♚</button>
      </div>
      <div class="row">
        <button id="side-rand">Random colour</button>
      </div>
      <label for="elo">Engine strength</label>
      <input type="range" id="elo" min="200" max="2850" step="25" value="200">
      <div id="elo-label"></div>
      <label class="opt">
        <input type="checkbox" id="eval-opt">
        <span>Show live engine evaluation</span>
      </label>
      <button id="start" style="max-width:320px; width:100%">Start Game</button>
    </div>
  </div>
  <div id="eval" hidden>
    <div id="eval-fill"></div>
    <div id="eval-score">…</div>
  </div>
  <div class="player" id="p-bot">
    <div class="name" id="bot-name"></div>
    <div class="material" id="bot-mat"></div>
  </div>
  <div id="controls">
    <button id="btn-new">New Game</button>
    <button id="btn-undo" disabled>Undo</button>
  </div>

<script src="js/shared/audio.js"></script>
<script src="js/shared/celebrate.js"></script>
<script type="module" src="js/chess.js"></script>
</body>
</html>
