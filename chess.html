<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7035083353596708"
     crossorigin="anonymous"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chess</title>
<link rel="stylesheet" href="css/chess.css">
</head>
<body>
  <header>
    <a href="index.html">← Games</a>
    <div id="status"></div>
  </header>
  <div class="player" id="p-top">
    <div class="name" id="top-name"></div>
    <div class="material" id="top-mat"></div>
  </div>
  <div id="wrap">
    <div id="board"></div>
    <div id="promo"></div>
    <div id="overlay">
      <h1>♞ Chess</h1>
      <div id="ov-msg">Play against Stockfish 18, right in your browser.</div>
      <div class="row">
        <button id="side-w" class="on">Play White ♔</button>
        <button id="side-b">Play Black ♚</button>
      </div>
      <label for="elo">Engine strength</label>
      <input type="range" id="elo" min="200" max="2850" step="25" value="200">
      <div id="elo-label"></div>
      <button id="start" style="max-width:320px; width:100%">Start Game</button>
    </div>
  </div>
  <div class="player" id="p-bot">
    <div class="name" id="bot-name"></div>
    <div class="material" id="bot-mat"></div>
  </div>
  <div id="controls">
    <button id="btn-new">New Game</button>
    <button id="btn-undo" disabled>Undo</button>
  </div>

<script src="js/shared/audio.js"></script>
<script src="js/shared/celebrate.js"></script>
<script type="module" src="js/chess.js"></script>
</body>
</html>
