<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7035083353596708"
     crossorigin="anonymous"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Play English draughts (checkers) for free in your browser. Captures are mandatory! Pick your engine strength and play. No download or sign-up needed.">
<title>Checkers — Free Browser Game</title>
<link rel="canonical" href="https://maguire.app/checkers.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Free Browser Games">
<meta property="og:title" content="Checkers — Free Browser Game">
<meta property="og:description" content="Play English draughts (checkers) for free in your browser. Captures are mandatory! Pick your engine strength and play.">
<meta property="og:url" content="https://maguire.app/checkers.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Checkers — Free Browser Game">
<meta name="twitter:description" content="Play English draughts (checkers) for free in your browser.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoGame",
  "name": "Checkers",
  "url": "https://maguire.app/checkers.html",
  "description": "Play English draughts (checkers) for free in your browser. Captures are mandatory!",
  "genre": "Strategy",
  "playMode": "SinglePlayer",
  "audience": { "@type": "PeopleAudience", "suitableForAge": "4+" },
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
}
</script>
<link rel="stylesheet" href="css/checkers.css">
</head>
<body>
  <header>
    <a href="index.html">← Games</a>
    <div id="status"></div>
  </header>
  <div class="player" id="p-top">
    <div class="name" id="top-name"></div>
    <div class="material" id="top-mat"></div>
  </div>
  <div id="wrap">
    <div id="board"></div>
    <div id="overlay">
      <h1>⛃ Checkers</h1>
      <div id="ov-msg">English draughts vs a built-in engine. Captures are mandatory!</div>
      <div class="row">
        <button id="side-r" class="on">Play Red (first)</button>
        <button id="side-b">Play Black</button>
      </div>
      <div class="row">
        <button id="side-rand">Random colour</button>
      </div>
      <label for="lvl">Engine strength</label>
      <input type="range" id="lvl" min="0" max="9" step="1" value="0">
      <div id="lvl-label"></div>
      <label class="opt">
        <input type="checkbox" id="eval-opt">
        <span>Show live engine evaluation</span>
      </label>
      <button id="start" style="max-width:320px; width:100%">Start Game</button>
    </div>
  </div>
  <div id="eval" hidden>
    <div id="eval-fill"></div>
    <div id="eval-score">…</div>
  </div>
  <div class="player" id="p-bot">
    <div class="name" id="bot-name"></div>
    <div class="material" id="bot-mat"></div>
  </div>
  <div id="controls">
    <button id="btn-new">New Game</button>
    <button id="btn-undo" disabled>Undo</button>
  </div>

<script src="js/shared/audio.js"></script>
<script src="js/shared/celebrate.js"></script>
<script src="js/checkers.js"></script>
</body>
</html>
