<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7035083353596708"
     crossorigin="anonymous"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Checkers</title>
<link rel="stylesheet" href="css/checkers.css">
</head>
<body>
  <header>
    <a href="index.html">← Games</a>
    <div id="status"></div>
  </header>
  <div class="player" id="p-top">
    <div class="name" id="top-name"></div>
    <div class="material" id="top-mat"></div>
  </div>
  <div id="wrap">
    <div id="board"></div>
    <div id="overlay">
      <h1>⛃ Checkers</h1>
      <div id="ov-msg">English draughts vs a built-in engine. Captures are mandatory!</div>
      <div class="row">
        <button id="side-r" class="on">Play Red (first)</button>
        <button id="side-b">Play Black</button>
      </div>
      <label for="lvl">Engine strength</label>
      <input type="range" id="lvl" min="0" max="9" step="1" value="0">
      <div id="lvl-label"></div>
      <button id="start" style="max-width:320px; width:100%">Start Game</button>
    </div>
  </div>
  <div class="player" id="p-bot">
    <div class="name" id="bot-name"></div>
    <div class="material" id="bot-mat"></div>
  </div>
  <div id="controls">
    <button id="btn-new">New Game</button>
    <button id="btn-undo" disabled>Undo</button>
  </div>

<script src="js/shared/audio.js"></script>
<script src="js/shared/celebrate.js"></script>
<script src="js/checkers.js"></script>
</body>
</html>
