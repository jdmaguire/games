<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Snake</title>
<link rel="stylesheet" href="css/snake.css">
</head>
<body>
  <div id="hud">
    <div><div class="label">Score</div><div class="value" id="score">0</div></div>
    <a id="back" href="index.html">← Games</a>
    <div style="text-align:right"><div class="label">Best</div><div class="value" id="best">0</div></div>
  </div>
  <div id="board-wrap">
    <canvas id="board"></canvas>
    <div id="overlay">
      <h1 id="overlay-title">Snake</h1>
      <p class="big-score" id="overlay-score" hidden></p>
      <p id="overlay-hint"></p>
    </div>
  </div>

<script src="js/snake.js"></script>
</body>
</html>
